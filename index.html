<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#B4232C" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="PDF" />
  <meta name="description" content="تقليص ودمج وتنظيم ملفات PDF وتحويل الصور إلى PDF داخل متصفحك دون رفع الملفات." />
  <title>تقليص PDF</title>
  <link rel="icon" type="image/png" href="/apple-touch-icon.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
</head>
<body>
  <div class="wrap">
    <header class="top">
      <img src="/apple-touch-icon.png" alt="" class="logo" />
      <div>
        <h1>تقليص PDF</h1>
        <p>كل المعالجة على جهازك، ولا تُرفع ملفاتك إلى أي مكان</p>
      </div>
    </header>

    <nav class="tools" id="tools" aria-label="الأدوات">
      <button type="button" class="tool on" data-tool="compress"><svg class="ico"><use href="#i-compress"/></svg><span>تقليص الحجم</span></button>
      <button type="button" class="tool" data-tool="merge"><svg class="ico"><use href="#i-merge"/></svg><span>دمج ملفات</span></button>
      <button type="button" class="tool" data-tool="pages"><svg class="ico"><use href="#i-pages"/></svg><span>تنظيم الصفحات</span></button>
      <button type="button" class="tool" data-tool="images"><svg class="ico"><use href="#i-image"/></svg><span>صور إلى PDF</span></button>
    </nav>

    <main id="view"></main>

    <footer>
      <a href="classic.html">الواجهة الكلاسيكية مع الإعدادات المتقدمة</a>
    </footer>
  </div>

  <div class="drop-hint" id="dropHint" hidden><div><svg class="ico"><use href="#i-upload"/></svg><p>أفلت الملفات هنا</p></div></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
    <symbol id="i-compress" viewBox="0 0 24 24"><path d="M7 3.5h7l4 4V20.5H7z"/><path d="M14 3.5V8h4M12.5 10v3M12.5 13l-2-2M12.5 13l2-2M12.5 17.5v-3M12.5 14.5l-2 2M12.5 14.5l2 2"/></symbol>
    <symbol id="i-merge" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="9" height="11" rx="1.5"/><rect x="11.5" y="9.5" width="9" height="11" rx="1.5"/></symbol>
    <symbol id="i-pages" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><circle cx="9" cy="10" r="1.8"/><path d="m4 18 5-5 4 4 2.5-2.5L20 19"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 15V4M7.5 8.5 12 4l4.5 4.5M5 19.5h14"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11M7.5 10.5 12 15l4.5-4.5M5 19.5h14"/></symbol>
    <symbol id="i-share" viewBox="0 0 24 24"><path d="M12 15V3.5M8 7.5l4-4 4 4"/><path d="M6 11H5v9.5h14V11h-1"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M6.5 3.5h8L19 8v12.5H6.5z"/><path d="M14 3.5V8h5"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
    <symbol id="i-up" viewBox="0 0 24 24"><path d="m6 15 6-6 6 6"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
    <symbol id="i-rotate" viewBox="0 0 24 24"><path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3M19.5 4v4.5H15"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4.5 7h15M10 7V4.5h4V7M6.5 7l1 13h9l1-13"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
    <symbol id="i-left" viewBox="0 0 24 24"><path d="m14.5 6-6 6 6 6"/></symbol>
    <symbol id="i-right" viewBox="0 0 24 24"><path d="m9.5 6 6 6-6 6"/></symbol>
  </defs></svg>

  <script type="module" src="/src/app/main.js"></script>
  <script src="https://adelss12.github.io/back.js" defer></script>
</body>
</html>
